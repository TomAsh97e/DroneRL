# plan/M1.md, experiment 2: own PPO with the hyperparameters of sb3_ppo_vel.yaml.
# SB3 defaults matched explicitly: constant learning rate, no value clipping.
env_id: dronerl.envs:GoalReach-v0
env_kwargs: {act: vel, reward: dense}
exp: m1/exp2
variant: ppo_vel
total_steps: 3000000
num_envs: 16
async_envs: true
num_steps: 1024
num_minibatches: 8
update_epochs: 10
learning_rate: 3.0e-4
anneal_lr: false
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
clip_vloss: false
ent_coef: 0.0
hidden: 128
eval_every: 50000
