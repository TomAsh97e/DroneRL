# plan/M1.md, experiment 1: PPO on motor RPMs, dense reward
algo: ppo
env_id: dronerl.envs:GoalReach-v0
env_kwargs: {act: rpm, reward: dense}
exp: m1/exp1
variant: sb3_ppo_rpm
total_steps: 15000000
n_envs: 16
subproc: true
normalize: true
eval_every: 250000
params:
  n_steps: 1024
  batch_size: 2048
  n_epochs: 10
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  policy_kwargs: {net_arch: [128, 128]}
