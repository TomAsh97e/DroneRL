# rl-baselines3-zoo hyperparams/ppo.yml (LunarLanderContinuous-v3), plus VecNormalize as required by plan/M0.md
algo: ppo
env_id: LunarLander-v3
env_kwargs: {continuous: true}
exp: m0/main
variant: sb3_ppo
total_steps: 1000000
n_envs: 16
normalize: true
eval_every: 50000
params:
  n_steps: 1024
  batch_size: 64
  gae_lambda: 0.98
  gamma: 0.999
  n_epochs: 4
  ent_coef: 0.01
