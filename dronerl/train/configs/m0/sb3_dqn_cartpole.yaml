# rl-baselines3-zoo hyperparams/dqn.yml (CartPole-v1)
algo: dqn
env_id: CartPole-v1
exp: m0/main
variant: sb3_dqn
total_steps: 50000
eval_every: 2500
params:
  learning_rate: 2.3e-3
  batch_size: 64
  buffer_size: 100000
  learning_starts: 1000
  gamma: 0.99
  target_update_interval: 10
  train_freq: 256
  gradient_steps: 128
  exploration_fraction: 0.16
  exploration_final_eps: 0.04
  policy_kwargs: {net_arch: [256, 256]}
